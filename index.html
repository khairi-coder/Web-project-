<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Khailuxe</h1>
        <p>sign in to order</p>
    </header>

    <form action="submit" method="post">
        <div>
            <legend>Sign in</legend>
<div class="personal-details">
            <label for="full-name">FULL NAME</label>
<input type="text" name="full-name" id="full-name" minlength="8" maxlength="10" required>

<label for="email">EMAIL ADDRESS</label>
    <input type="email" name="email" id="email" required>

    <label for="phone-number">PHONE NUMBER</label>
    <input type="text" name="phone-number" id="phone-number" required>
</div>

<div class="country-details"></div>
<label for="country">COUNTRY</label>
<select name="country" id="country">
    <option value="country">NIGERIA</option>
    <option value="country">INDIA</option>
    <option value="country">USA</option>
    <option value="country">KENYA</option>
</select>
</div>

<input type="checkbox" name="consent" id="consent" required>
<label for="consent>i agree to the terms and condition</label>

        </fieldset>
    </form>
</body>
</html>
